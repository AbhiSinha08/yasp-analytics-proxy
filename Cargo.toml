[package]
name = "yasp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Yet Another SQL Proxy: a multi-database analytics gateway"
publish = false

[features]
default = []
# External JDBC integration tests, prepared by scripts/test.py.
client-tests = []
# Local Redshift integration tests, prepared by scripts/test.py.
redshift-tests = []
# Rust-only hosts do not need a Python installation or libpython.
python = ["dep:pyo3"]
snowflake = ["dep:jsonwebtoken", "dep:rsa", "dep:pkcs8", "dep:base64", "dep:uuid", "dep:chrono"]

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
pgwire = { version = "0.41.1", default-features = false, features = ["server-api-ring", "client-api-ring"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
sqlparser = { version = "0.63", features = ["visitor", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
pyo3 = { version = "0.29", optional = true, default-features = false, features = ["macros"] }
serde_json = "1.0"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.11"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
jsonwebtoken = { version = "9", optional = true }
rsa = { version = "0.9", optional = true }
pkcs8 = { version = "0.10", optional = true, features = ["encryption", "pem"] }
base64 = { version = "0.22", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }

[[example]]
name = "python_environment"
required-features = ["python"]

[[example]]
name = "snowflake_gateway"
required-features = ["snowflake"]

[[test]]
name = "jdbc"
required-features = ["client-tests"]
