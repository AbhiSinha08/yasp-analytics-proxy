version: 1
gateway:
  protocol: postgresql
  listen: "127.0.0.1:6432"
  max_sessions: 32
  max_message_bytes: 8388608
  max_sql_bytes: 1048576
  query_timeout_ms: 60000
  read_timeout_ms: 60000
  startup_timeout_ms: 120000
  shutdown_timeout_ms: 200
  write_timeout_ms: 60000
  tls:
    mode: disable
targets:
  primary:
    engine: postgresql
    host: localhost
    port: 5432
    database: postgres
    tls:
      mode: disable
    logins:
      restricted:
        username: local
        password_env: YASP_TEST_TARGET_PASSWORD
      secondary:
        username: local2
        password_env: YASP_TEST_SECOND_PASSWORD

hooks:
  select_backend:
    type: rust
    callback: builtin.select_backend.passthrough
    params:
      target: primary
      backend_login: restricted
