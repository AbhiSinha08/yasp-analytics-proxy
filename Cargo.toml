[package]
name = "yasp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Yet Another SQL Proxy: a multi-database analytics gateway"
publish = false

[features]
default = []
# Rust-only hosts do not need a Python installation or libpython.
python = ["dep:pyo3"]

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
pgwire = { version = "0.41.1", default-features = false, features = ["server-api-ring", "client-api-ring"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
sqlparser = { version = "0.63", features = ["visitor"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
pyo3 = { version = "0.29", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "python_environment"
required-features = ["python"]
