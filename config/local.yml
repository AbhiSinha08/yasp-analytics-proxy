version: 1

gateway:
  protocol: redshift
  listen: "127.0.0.1:6432"
  max_sessions: 32
  max_message_bytes: 8388608
  max_sql_bytes: 1048576
  query_timeout_ms: 60000
  read_timeout_ms: 600000
  write_timeout_ms: 60000
  startup_timeout_ms: 120000
  shutdown_timeout_ms: 10000
  tls:
    mode: enable
    cert_file: local-tls/server.crt
    key_file: local-tls/server.key

targets:
  primary:
    engine: postgresql
    host: localhost
    port: 5432
    database: development
    tls:
      mode: disable
    logins:
      restricted:
        username: local
        password_env: YASP_PRIMARY_RESTRICTED_PASSWORD
      analyst:
        username: local2
        password_env: YASP_TEST_SECOND_PASSWORD

schema_discovery:
  target: primary
  backend_login: restricted
  catalog:
    schemas: [public]

cache:
  enabled: true
  url_env: YASP_REDIS_URL
  ttl_seconds: 60
  namespace: "yasp:cache"
  max_rows_per_query: 10000
  max_buffered_bytes_total: 33554432

application_contexts:
  url_env: YASP_REDIS_URL
  namespace: "yasp:datasets"
  datasets:
    users:
      refresh_interval_seconds: 0
      loader:
        type: rust
        callback: builtin.dataset.load_json
        params:
          file: hooks/examples/users.json
    email_locations:
      refresh_interval_seconds: 0
      loader:
        type: rust
        callback: builtin.dataset.load_json
        params:
          file: hooks/examples/email_locations.json

hooks:
  context:
    type: python
    path: ../hooks/examples/context.py
    callback: derive_context
    params:
      workload: reporting
      report_kind: dashboard
  select_backend:
    type: python
    path: ../hooks/examples/role_selector.py
    callback: select_backend
    params:
      target_by_workload:
        reporting: primary
      login_by_department:
        finance:
          primary: restricted
      type_by_report:
        dashboard: null
  python:
    search_paths: []
    queue_capacity: 32
    queue_max_bytes: 4194304
    max_payload_bytes: 2097152
    execution_timeout_ms: 2000
