[package]
name = "yasp-snowflake-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

# Isolate candidate driver dependencies from the gateway until its gates pass.
[workspace]

[[bin]]
name = "yasp-snowflake-probe"
path = "adbc_probe.rs"

[[bin]]
name = "yasp-snowflake-ffi-probe"
path = "adbc_ffi_probe.rs"

[dependencies]
adbc_ffi = "=0.24.0"
libloading = "=0.8.9"
adbc_core = "=0.24.0"
adbc_driver_manager = "=0.24.0"
arrow-array = "=59.0.0"
arrow-schema = "=59.0.0"
serde_json = "1"

