# Loadable local-development configuration; provision these databases and logins first.
# Future settings are preserved in comments and are not accepted by the runtime yet.
# *_env fields name environment variables, not literal secret values.
# The selection callback chooses a target/login per query within configured bounds.
version: 1

gateway:
  protocol: postgresql # redshift selects the experimental TLS password profile.
  listen: "127.0.0.1:6432"
  max_sessions: 32
  max_message_bytes: 8388608
  max_sql_bytes: 1048576
  # Future prepared queries and portals:
  # max_prepared_statements_per_session: 128
  # max_portals_per_session: 32
  queue_timeout_ms: 60000 # Maximum asynchronous wait for backend capacity.
  query_timeout_ms: 60000
  read_timeout_ms: 600000
  write_timeout_ms: 60000
  startup_timeout_ms: 120000
  shutdown_timeout_ms: 10000
  async_hook_timeout_ms: 2000
  max_context_bytes: 65536
  tls:
    mode: disable # Plaintext on the configured listener; see docs/tls.md.
    # For encrypted client sessions, set mode: enable and provide both:
    # cert_file: certs/yasp-chain.pem
    # key_file: certs/yasp-key.pem
  # NOTE: The Gateway requires setting 'preferQueryMode=simple' for JDBC connections to it.
  # Otherwise JDBC defaults to extended query mode, which is not yet supported by YASP.
  # For psycopg2 through SQLAlchemy, use AUTOCOMMIT to allow YASP result caching.
  # In BI connection settings accepting engine_params JSON, use {"engine_params":{"isolation_level":"AUTOCOMMIT"}}.
  # Explicit transactions are supported but bypass YASP's result cache.

targets:
  primary:
    engine: postgresql
    host: "127.0.0.1"
    port: 5432
    database: yasp_primary
    tls:
      mode: disable # Plaintext, including private VPC endpoints; use enable for verified TLS.
      # ca_file: certs/source-ca.pem # Omit to use system roots.
      # cert_file: certs/source-client.pem # Optional client identity.
      # key_file: certs/source-client-key.pem
    logins:
      restricted:
        username: yasp_restricted
        password_env: YASP_PRIMARY_RESTRICTED_PASSWORD
      analyst:
        username: yasp_analyst
        password_env: YASP_PRIMARY_ANALYST_PASSWORD
  secondary:
    engine: postgresql
    host: "127.0.0.1"
    port: 5432
    database: yasp_secondary
    tls:
      mode: disable
    logins:
      restricted:
        username: yasp_restricted
        password_env: YASP_SECONDARY_RESTRICTED_PASSWORD
      analyst:
        username: yasp_analyst
        password_env: YASP_SECONDARY_ANALYST_PASSWORD

# Example only: warehouse engines can group compute resources behind one target.
# PostgreSQL targets use a single host/port and should not configure this section.
# targets:
#   warehouse_analytics:
#     engine: warehouse
#     database: analytics
#     tls:
#       mode: enable
#     logins:
#       analyst:
#         username: yasp_analyst
#         password_env: YASP_WAREHOUSE_ANALYST_PASSWORD
#         overrides:
#           large_a:
#             username: yasp_analyst_large
#             password_env: YASP_WAREHOUSE_ANALYST_LARGE_PASSWORD
#     compute:
#       default_type: small
#       types:
#         small:
#           max_in_flight: 4
#           max_connections: 8
#           instances:
#             - id: small_a
#               host: warehouse-small-a.example
#               port: 443
#             - id: small_b
#               host: warehouse-small-b.example
#               port: 443
#         large:
#           max_in_flight: 8
#           max_connections: 12
#           instances:
#             - id: large_a
#               host: warehouse-large-a.example
#               port: 443

# Future frontend principals and engine-enforced connection bounds:
# principals:
#   metabase:
#     scram_verifier_env: YASP_METABASE_SCRAM_VERIFIER
#     permitted_connections:
#       primary: [restricted, analyst]
#       secondary: [restricted, analyst]

# Metadata bypasses application hooks and the result cache. A target is required
# when several targets exist; an omitted login uses its first declared login.
schema_discovery:
  # Required periodically refreshed metadata from this discovery identity.
  catalog:
    schemas: [public]
  #   refresh_interval_seconds: 60
  #   refresh_timeout_ms: 10000
  #   max_age_seconds: 300
  #   max_rows: 100000
  #   max_bytes: 16777216
  target: primary
  backend_login: restricted

backend:
  max_connections_per_pool: 8 # Pools are partitioned by target/login.
  max_connections_total: 32 # Shared physical connection cap across configured targets.
  # Future configurable backend lifecycle deadlines:
  # connect_timeout_ms: 5000
  # idle_transaction_timeout_ms: 30000
  # cleanup_timeout_ms: 5000

# Complete read-only results; source grants are not rechecked on cache hits.
cache:
  # Use redis:// for plaintext or rediss:// for verified TLS, independently of other links.
  # tls:
  #   ca_file: certs/redis-ca.pem
  #   cert_file: certs/redis-client.pem
  #   key_file: certs/redis-client-key.pem
  enabled: false
  url_env: YASP_REDIS_URL
  namespace: "yasp:cache"
  ttl_seconds: 3600 # Hits do not extend expiry.
  max_rows_per_query: 10000
  max_buffered_bytes_total: 33554432 # Aggregate in-process cache buffer budget.
  # Optional bypass for live monitoring queries:
  # eligibility:
  #   type: rust
  #   callback: builtin.cache_eligibility.exclude_sql_containing
  #   params:
  #     excluded_sql_fragments: [pg_stat_activity, clock_timestamp]
  # Python alternative (shares the selector's runtime):
  # eligibility:
  #   type: python
  #   path: ../hooks/examples/cache_eligibility.py
  #   callback: cache_eligibility
  #   params:
  #     excluded_sql_fragments: [pg_stat_activity, clock_timestamp]

# Optional output data context; omitting decision_model disables classification.
# See docs/decision-model.md and docs/ast-lineage.md.
# data_contexts:
#   ast:
#     enabled: true # Local output lineage; no dictionary lookup or classification.
#     namespace: "yasp:ast_cache" # Uses the result cache Redis connection and TTL.
#   decision_model:
#     namespace: "yasp:decision_cache" # Uses the result cache Redis connection and TTL.
#     endpoint: http://127.0.0.1:8001/v1/systemone
#     sample_size: 5
#     include_sql: true # Set false to send only column metadata and samples.
#     timeout_ms: 2000
#     fail_on_error: false
#     headers_env:
#       Authorization: YASP_MODEL_AUTHORIZATION # Complete header value from env/.env.
#     questions:
#       email: "Do these values contain email addresses?"
#       phone: "Do these values contain telephone numbers?"

hooks:
  # Optional ordinary-query provider, after metadata/setup recognition.
  # query_context:
  #   type: rust
  #   callback: builtin.query_context.metabase
  #   params: {} # Optional native_dialect for mixed target dialects.

  # Optional SQL replacement after context and parsing.
  # modify_query:
  #   type: rust
  #   callback: example.modify_query.rename_table
  #   params:
  #     from: public.orders
  #     to: reporting.orders_v2

  select_backend:
    type: rust
    callback: builtin.select_backend.passthrough
    params:
      target: primary
      backend_login: restricted

  # Python alternative: replace select_backend above and build with --features python.
  # select_backend:
  #   type: python
  #   path: ../hooks/examples/select_backend.py
  #   callback: select_backend
  #   params:
  #     target: primary
  #     backend_login: restricted

  python:
    search_paths: []
    queue_capacity: 32
    queue_max_bytes: 4194304
    max_payload_bytes: 2097152
    execution_timeout_ms: 2000 # Stops waiting; executing Python retains its worker.

  # Application selector resolves the extracted user ID against the users dataset.
  # Replace select_backend above after validating metadata and implementing the policy.
  # select_backend:
  #   type: python
  #   path: ../hooks/examples/rbac.py
  #   callback: select_backend
  #   params:
  #     target: primary
  #     login_by_account: {admin: restricted, limited: analyst}

  # Optional bounded processing on source reads and raw cache hits.
  # process_result:
  #   type: rust
  #   callback: builtin.process_result.uppercase
  #   params: {column: customer_name}

# result_processing:
#   max_rows_per_batch: 256
#   target_batch_bytes: 262144
#   max_buffered_bytes_total: 33554432

application_contexts:
  # The URL and optional tls settings are independent of the result cache.
  # tls:
  #   ca_file: certs/redis-ca.pem
  #   cert_file: certs/redis-client.pem
  #   key_file: certs/redis-client-key.pem
  url_env: YASP_REDIS_URL
  namespace: "yasp:datasets"
  refresh_timeout_ms: 30000
  max_dataset_bytes: 16777216
  max_lookup_bytes: 65536
  datasets:
    users:
      refresh_interval_seconds: 0
      loader:
        type: rust
        callback: builtin.dataset.load_json
        params: { file: hooks/examples/users.json }
    email_locations:
      refresh_interval_seconds: 900
      loader:
        type: rust
        callback: builtin.dataset.load_json
        params: { file: hooks/examples/email_locations.json }

# Future engine-applied masks, independent of optional result callbacks:
# policy:
#   result_masks: [] # Optional presentation rules; source roles enforce RBAC.
