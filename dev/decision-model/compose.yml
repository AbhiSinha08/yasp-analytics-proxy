name: yasp-decision-model

services:
  laya:
    image: yasp-laya:local
    build:
      context: https://github.com/NandhaKishorM/laya.git#main
      dockerfile: Dockerfile
      args:
        TORCH_INDEX: cpu
        TORCH_VERSION: "2.14.0"
    command: ["laya-serve"]
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_REVISION: reviewed
      LAYA_MODELS: typed-decisions
      LAYA_DEFAULT_MODEL: typed-decisions
      LAYA_PRELOAD: "1"
      LAYA_MAX_LOADED: "1"
      LAYA_MAX_CONCURRENT: "4"
      LAYA_MAX_TOKEN_BUDGET: "2048"
      LAYA_THREADS: "4"
      LAYA_JEV_STRICT: "1"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      LAYA_LOG_LEVEL: info
      OMP_NUM_THREADS: "4"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    cpus: 4.0
    mem_limit: 8g
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s

volumes:
  model-cache:
