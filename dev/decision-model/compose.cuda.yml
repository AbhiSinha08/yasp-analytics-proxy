services:
  laya:
    build:
      args:
        TORCH_INDEX: cu130
    environment:
      LAYA_DEVICE: cuda
      LAYA_CUDA_AMP: fp16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LAYA_GPU_ID:-0}"]
              capabilities: [gpu]
